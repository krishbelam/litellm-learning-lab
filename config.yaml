model_list:
  # Local model: Ollama runs on the Docker host, not in this Compose project.
  # ----------------------------------------
  # SIMPLE / CHEAPER MODEL
  # ----------------------------------------
  - model_name: local-llama-small-ctx
    litellm_params:
      model: ollama_chat/qwen2.5:3b
      api_base: http://host.docker.internal:11434
    model_info:
      input_cost_per_token: 0.0000002   # Cost per 1 input token in USD
      output_cost_per_token: 0.0000005  # Cost per 1 output token in USD

  - model_name: local-llama-small-ctx
    litellm_params:
      model: ollama_chat/llama3.2:latest
      api_base: http://host.docker.internal:1143
    model_info:
      input_cost_per_token: 0.0000005   # Cost per 1 input token in USD
      output_cost_per_token: 0.00000010  # Cost per 1 output token in USD


  # ----------------------------------------
  # ADVANCED MODEL
  # ----------------------------------------
  - model_name: local-llama-large-ctx
    litellm_params:
      model: ollama_chat/llama3.2:latest
      api_base: http://host.docker.internal:11434
    model_info:
      input_cost_per_token: 0.0000010   # Cost per 1 input token in USD
      output_cost_per_token: 0.0000050  # Cost per 1 output token in USD


  # OPTIONAL CLOUD MODEL:
  # 1. Set OPENAI_API_KEY in .env.
  # 2. Uncomment this entire model entry.
  # 3. Recreate/restart the LiteLLM service.
  #
  # - model_name: cloud-gpt
  #   litellm_params:
  #     model: openai/gpt-4.1-mini
  #     api_key: os.environ/OPENAI_API_KEY

# ==========================================
# ROUTER SETTINGS
# ==========================================
router_settings:
  routing_strategy: simple-shuffle


# ==========================================
# GENERAL SETTINGS
# ==========================================
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

# Keep proxy-level routing defaults simple for this learning lab.
# Per-key and per-team RPM/TPM/spend limits are configured when creating
# virtual keys/teams in the LiteLLM UI or key-management API.

